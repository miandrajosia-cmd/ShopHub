<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Site web personnel de Josia Rakotovao - Developpeur Web & Createur Digital">
  <meta name="author" content="Manda Halimanana Miandra Josia Rakotovao">
  <title>Josia Rakotovao | Site Personnel</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========== NAVIGATION ========== -->
  <nav id="navbar" class="navbar">
    <div class="container nav-container">
      <a href="#hero" class="nav-logo" id="nav-logo"></a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Menu">
        <i class="fas fa-bars"></i>
      </button>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <!-- ========== HERO SECTION ========== -->
  <section id="hero" class="hero">
    <div class="container hero-container">
      <div class="hero-text">
        <p class="hero-greeting">Bonjour, je suis</p>
        <h1 class="hero-name" id="hero-name"></h1>
        <h2 class="hero-title" id="hero-title"></h2>
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <div class="hero-buttons">
          <a href="#contact" class="btn btn-primary">Me Contacter</a>
          <a href="#projects" class="btn btn-outline">Voir Mes Projets</a>
        </div>
        <div class="hero-social" id="hero-social"></div>
      </div>
      <div class="hero-image-wrapper">
        <div class="hero-image-container">
          <img id="hero-image" src="" alt="Photo de profil" class="hero-image">
        </div>
      </div>
    </div>
  </section>

  <!-- ========== ABOUT SECTION ========== -->
  <section id="about" class="section about">
    <div class="container">
      <h2 class="section-title" id="about-title"></h2>
      <div class="about-content">
        <p class="about-description" id="about-description"></p>
        <div class="about-highlights" id="about-highlights"></div>
      </div>
    </div>
  </section>

  <!-- ========== SKILLS SECTION ========== -->
  <section id="skills" class="section skills">
    <div class="container">
      <h2 class="section-title" id="skills-title"></h2>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>

  <!-- ========== PROJECTS SECTION ========== -->
  <section id="projects" class="section projects">
    <div class="container">
      <h2 class="section-title" id="projects-title"></h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <!-- ========== SERVICES SECTION ========== -->
  <section id="services" class="section services">
    <div class="container">
      <h2 class="section-title" id="services-title"></h2>
      <div class="services-grid" id="services-grid"></div>
    </div>
  </section>

  <!-- ========== CONTACT SECTION ========== -->
  <section id="contact" class="section contact">
    <div class="container">
      <h2 class="section-title" id="contact-title"></h2>
      <p class="contact-subtitle" id="contact-subtitle"></p>
      <div class="contact-container">
        <div class="contact-info" id="contact-info"></div>
        <form class="contact-form" id="contact-form">
          <div class="form-group">
            <label for="name">Nom Complet</label>
            <input type="text" id="name" name="name" placeholder="Votre nom" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="votre@email.com" required>
          </div>
          <div class="form-group">
            <label for="subject">Sujet</label>
            <input type="text" id="subject" name="subject" placeholder="Sujet du message" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-full">
            <i class="fas fa-paper-plane"></i> Envoyer le Message
          </button>
        </form>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">
      <div class="footer-social" id="footer-social"></div>
      <p class="footer-text" id="footer-text"></p>
    </div>
  </footer>

  <!-- ========== BACK TO TOP ========== -->
  <button id="back-to-top" class="back-to-top" aria-label="Retour en haut">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
